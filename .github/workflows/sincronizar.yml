name: Sincronizador de Google Drive

on:
  schedule:
    - cron: '*/15 * * * *' # Se ejecuta automáticamente cada 15 minutos
  workflow_dispatch: # Te permite ejecutar el script manualmente con un botón

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    
    # Esto es crucial para que GitHub te permita guardar el archivo copiados.txt de vuelta en tu repo
    permissions:
      contents: write 

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Ejecutar script de sincronización
        env:
          # Aquí llamamos a la bóveda de secretos que configuraste
          GCP_TOKEN: ${{ secrets.GCP_TOKEN }}
        # Asegúrate de que el nombre del archivo coincida exactamente con el de tu script
        run: python sincronizar_drive.py 

      - name: Guardar historial de archivos copiados
        run: |
          git config --global user.name 'GitHub Actions Automator'
          git config --global user.email 'actions@github.com'
          git add copiados.txt
          # Si hay algo nuevo que guardar, hace el commit. Si no, simplemente avisa y continúa.
          git commit -m "Actualiza registro de archivos copiados" || echo "No hay archivos nuevos copiados en esta revisión"
          git push
